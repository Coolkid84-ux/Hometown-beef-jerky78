function reset(){x=80;y=130;vx=0;vy=0;ballx=200;bally=100;dx=3;dy=3;ticks=0;score=0;objects=Array.from({length:7},()=>({x:Math.random()*w,y:Math.random()*h,r:10+Math.random()*7}));$("score").textContent="Score: 0"}$("again").onclick=reset;
function frame(){ctx.clearRect(0,0,w,h);ticks++;ctx.fillStyle="#5ce1bd";ctx.font="22px system-ui";
if(m==="snake"){if(ticks%9===0){x+=keys.ArrowRight?18:keys.ArrowLeft?-18:keys.ArrowUp?0:18;y+=keys.ArrowUp?-18:keys.ArrowDown?18:0;if(x<0||x>w-18||y<0||y>h-18){reset()}else{score++;$("score").textContent="Score: "+score}}ctx.fillRect(x,y,17,17);ctx.fillText("Use arrows to move",10,25)}
else if(m==="pong"||m==="breakout"){px+=keys.ArrowLeft?-7:keys.ArrowRight?7:0;px=Math.max(0,Math.min(w-90,px));ballx+=dx;bally+=dy;if(ballx<8||ballx>w-8)dx*=-1;if(bally<8)dy*=-1;if(bally>h-30&&ballx>px&&ballx<px+90){dy=-Math.abs(dy);score++;$("score").textContent="Score: "+score}if(bally>h){bally=60;dy=3}ctx.fillRect(px,h-18,90,10);ctx.beginPath();ctx.arc(ballx,bally,9,0,7);ctx.fill();ctx.fillText("Move paddle",10,25)}
else{if(keys.ArrowLeft)x-=5;if(keys.ArrowRight)x+=5;if(keys.ArrowUp&&m!=="flappy")vy=-8;if(m==="flappy"&&keys[" "])vy=-4;vy+=.35;y+=vy;if(y>h-35){y=h-35;vy=0}x=Math.max(0,Math.min(w-25,x));objects.forEach(o=>{o.x-=m==="racer"||m==="bike"?0:2;if(o.x<0)o.x=w;if(Math.hypot(x-o.x,y-o.y)<o.r+15){score++;$("score").textContent="Score: "+score;o.x=Math.random()*w;o.y=Math.random()*h}});ctx.fillStyle="#8ca7ff";ctx.fillRect(x,y,24,28);ctx.fillStyle="#ffca69";objects.forEach(o=>{ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill()});ctx.fillStyle="#5ce1bd";ctx.fillText("Collect the glowing dots!",10,25)}
raf=requestAnimationFrame(frame)}frame()
}
}
